name: 2023 Qullamaggie Backtest

on:
  workflow_dispatch: # Allows you to trigger the backtest manually via a button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Backtester
        run: python backtest_2023.py

      - name: Save CSV Summary
        uses: actions/upload-artifact@v4
        with:
          name: Backtest-Results-CSV
          path: backtest_2023_summary.csv

      - name: Upload HTML Charts to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'html_charts'

  deploy-pages:
    needs: run-backtest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
